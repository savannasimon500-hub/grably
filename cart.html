<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Cart | Grably</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f7f7;
            color: #222;
        }

        header {
            background: white;
            padding: 20px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 28px;
        }

        nav a {
            color: #222;
            text-decoration: none;
        }

        .cart-button {
            background: #222;
            color: white;
            padding: 12px 18px;
            border-radius: 7px;
            text-decoration: none;
        }

        .cart-heading {
            text-align: center;
            padding: 55px 20px 30px;
        }

        .cart-heading small {
            letter-spacing: 5px;
            color: #777;
        }

        .cart-heading h1 {
            font-size: 42px;
            margin-top: 10px;
        }

        .cart-container {
            width: 92%;
            max-width: 1200px;
            margin: 0 auto 70px;

            display: grid;
            grid-template-columns: 1.5fr 0.7fr;
            gap: 30px;
        }

        .cart-box,
        .summary-box {
            background: white;
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .cart-item {
            display: grid;
            grid-template-columns: 110px 1fr auto;
            gap: 20px;
            align-items: center;

            padding: 20px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item img {
            width: 110px;
            height: 110px;
            object-fit: contain;
            background: #eee;
            border-radius: 10px;
        }

        .item-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .item-price {
            color: #666;
            margin-bottom: 14px;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-controls button {
            width: 34px;
            height: 34px;

            border: 1px solid #ccc;
            background: white;

            border-radius: 6px;
            cursor: pointer;

            font-size: 18px;
        }

        .quantity-number {
            min-width: 25px;
            text-align: center;
            font-weight: bold;
        }

        .item-right {
            text-align: right;
        }

        .item-total {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .remove-button {
            border: none;
            background: none;
            color: #b00020;

            cursor: pointer;
            text-decoration: underline;
        }

        .summary-box h2 {
            margin-bottom: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;

            padding: 12px 0;
        }

        .summary-total {
            border-top: 2px solid #222;

            margin-top: 10px;
            padding-top: 18px;

            font-size: 22px;
            font-weight: bold;
        }

        .checkout-button {
            width: 100%;

            display: block;

            margin-top: 25px;

            padding: 15px;

            background: #222;
            color: white;

            border-radius: 8px;

            text-align: center;
            text-decoration: none;

            font-weight: bold;
        }

        .continue-shopping {
            display: block;

            margin-top: 15px;

            text-align: center;

            color: #222;
        }

        .empty-cart {
            text-align: center;
            padding: 50px 20px;
        }

        .empty-cart h2 {
            margin-bottom: 12px;
        }

        .empty-cart p {
            color: #666;
            margin-bottom: 20px;
        }

        .empty-cart a {
            display: inline-block;

            background: #222;
            color: white;

            padding: 13px 22px;

            border-radius: 7px;

            text-decoration: none;
        }

        footer {
            background: #222;
            color: white;

            text-align: center;

            padding: 30px;
        }

        @media (max-width: 850px) {

            .cart-container {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 650px) {

            header {
                flex-wrap: wrap;
                gap: 15px;
            }

            nav {
                width: 100%;
                justify-content: center;
                order: 3;
            }

            .cart-item {
                grid-template-columns: 90px 1fr;
            }

            .cart-item img {
                width: 90px;
                height: 90px;
            }

            .item-right {
                grid-column: 2;
                text-align: left;
            }

            .cart-heading h1 {
                font-size: 34px;
            }

        }

    </style>
</head>


<body>


<header>

    <div class="logo">
        Grably
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="index.html#about">About</a>
    </nav>

    <a href="cart.html" class="cart-button">
        🛒 Cart <span id="cart-count">0</span>
    </a>

</header>



<section class="cart-heading">

    <small>
        GRABLY
    </small>

    <h1>
        Your Shopping Cart
    </h1>

</section>



<main class="cart-container">

    <section class="cart-box">

        <div id="cart-items">
        </div>

    </section>



    <aside class="summary-box">

        <h2>
            Order Summary
        </h2>

        <div class="summary-row">

            <span>
                Items
            </span>

            <span id="item-count">
                0
            </span>

        </div>


        <div class="summary-row">

            <span>
                Subtotal
            </span>

            <span id="subtotal">
                R0.00
            </span>

        </div>


        <div class="summary-row">

            <span>
                Delivery
            </span>

            <span>
                To be confirmed
            </span>

        </div>


        <div class="summary-row summary-total">

            <span>
                Total
            </span>

            <span id="total">
                R0.00
            </span>

        </div>


        <a
            href="checkout.html"
            class="checkout-button"
            id="checkout-button">

            Proceed to Checkout

        </a>


        <a
            href="shop.html"
            class="continue-shopping">

            ← Continue Shopping

        </a>

    </aside>

</main>



<footer>
    © 2026 Grably. All rights reserved.
</footer>



<script>

    let cart =
        JSON.parse(localStorage.getItem("grablyCart")) || [];


    function saveCart() {

        localStorage.setItem(
            "grablyCart",
            JSON.stringify(cart)
        );

    }


    function updateCartCount() {

        let quantity = 0;

        cart.forEach(product => {

            quantity += product.quantity || 1;

        });


        document.getElementById("cart-count").textContent =
            quantity;


        document.getElementById("item-count").textContent =
            quantity;

    }


    function getProductImage(productName) {

        const images = {

            "Adjustable Ankle Support":
                "images/1.jpeg",

            "Hanging Storage Organizer":
                "images/2.jpeg",

            "Adjustable Wrist Brace":
                "images/3.jpeg",

            "Padded Knee Support Strap":
                "images/4.jpeg",

            "Compression Knee Support":
                "images/5.jpeg",

            "Hand-Free Flat Mop":
                "images/6.jpeg",

            "Toothpaste Dispenser":
                "images/7.jpeg"

        };


        return images[productName] || "";

    }


    function displayCart() {

        const cartItems =
            document.getElementById("cart-items");


        cartItems.innerHTML = "";


        if (cart.length === 0) {

            cartItems.innerHTML = `

                <div class="empty-cart">

                    <h2>
                        Your cart is empty
                    </h2>

                    <p>
                        Add some products and they will appear here.
                    </p>

                    <a href="shop.html">
                        Start Shopping
                    </a>

                </div>

            `;


            document.getElementById("subtotal").textContent =
                "R0.00";


            document.getElementById("total").textContent =
                "R0.00";


            document.getElementById("checkout-button").style.display =
                "none";


            updateCartCount();

            return;

        }


        document.getElementById("checkout-button").style.display =
            "block";


        let subtotal = 0;


        cart.forEach((product, index) => {

            const quantity =
                product.quantity || 1;


            const itemTotal =
                Number(product.price) * quantity;


            subtotal += itemTotal;


            const image =
                product.image ||
                getProductImage(product.name);


            const cartItem =
                document.createElement("div");


            cartItem.className =
                "cart-item";


            cartItem.innerHTML = `

                <img
                    src="${image}"
                    alt="${product.name}">


                <div>

                    <div class="item-name">

                        ${product.name}

                    </div>


                    <div class="item-price">

                        R${Number(product.price).toFixed(2)} each

                    </div>


                    <div class="quantity-controls">

                        <button onclick="decreaseQuantity(${index})">
                            −
                        </button>

                        <span class="quantity-number">

                            ${quantity}

                        </span>

                        <button onclick="increaseQuantity(${index})">
                            +
                        </button>

                    </div>

                </div>


                <div class="item-right">

                    <div class="item-total">

                        R${itemTotal.toFixed(2)}

                    </div>

                    <button
                        class="remove-button"
                        onclick="removeProduct(${index})">

                        Remove

                    </button>

                </div>

            `;


            cartItems.appendChild(cartItem);

        });


        document.getElementById("subtotal").textContent =
            "R" + subtotal.toFixed(2);


        document.getElementById("total").textContent =
            "R" + subtotal.toFixed(2);


        updateCartCount();

    }


    function increaseQuantity(index) {

        cart[index].quantity =
            (cart[index].quantity || 1) + 1;


        saveCart();

        displayCart();

    }


    function decreaseQuantity(index) {

        const quantity =
            cart[index].quantity || 1;


        if (quantity > 1) {

            cart[index].quantity =
                quantity - 1;

        } else {

            cart.splice(index, 1);

        }


        saveCart();

        displayCart();

    }


    function removeProduct(index) {

        cart.splice(index, 1);

        saveCart();

        displayCart();

    }


    displayCart();

</script>


</body>

</html>
